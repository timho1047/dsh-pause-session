name: release

# Tag-driven single-package release.
#
#   vX.Y.Z  ->  dsh-pause-session@X.Y.Z
#
# The bundle's lib/ tree is committed. The workflow never installs
# dependencies: the source devDependencies link to a local DeepSeek Harness
# checkout that is not present on a runner.
#
# Maintainer flow:
#   1. `pnpm install && pnpm run verify` in the repository.
#   2. Run `pnpm run build`, then commit the rebuilt lib/ tree.
#   3. Bump package.json, add the CHANGELOG entry, and commit.
#   4. `git tag vX.Y.Z && git push origin main --follow-tags`.
#
# npm Trusted Publisher must be configured for this package on npmjs.com
# (owner: timho1047, repo: dsh-pause-session, workflow: release.yml).
# A new configuration must be used within 48 hours; create it immediately
# before the release tag if it has no successful publish yet.
# This workflow skips the publish step when that exact version already exists.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_DIR: ${{ github.workspace }}/.release
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use npm with trusted-publishing support
        run: npm install --global npm@11

      - name: Validate tag, manifest, and committed bundles
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const fail = (message) => {
            console.error(`release check: ${message}`)
            process.exit(1)
          }
          const root = process.cwd()
          const readJson = (file) => JSON.parse(fs.readFileSync(path.join(root, file), 'utf8'))
          const readText = (file) => fs.readFileSync(path.join(root, file), 'utf8')
          const tag = (process.env.GITHUB_REF_NAME ?? '').replace(/^v/, '')
          const pkg = readJson('package.json')

          if (!/^\d+\.\d+\.\d+$/.test(tag)) fail(`tag ${JSON.stringify(tag)} is not vX.Y.Z`)
          if (pkg.name !== 'dsh-pause-session') fail(`unexpected package name ${pkg.name}`)
          if (pkg.version !== tag) fail(`tag ${tag} does not match package version ${pkg.version}`)
          if (pkg.engines?.dsh === undefined) fail('package.json must declare engines.dsh')

          for (const file of ['lib/index.js', 'lib/client.js', 'cordis.patch.yml', 'README.md', 'CHANGELOG.md']) {
            if (!fs.existsSync(path.join(root, file))) fail(`missing ${file}`)
          }
          for (const file of ['lib/index.js', 'lib/client.js']) {
            if (!readText(file).includes('dsh-pause-session')) fail(`${file} does not name dsh-pause-session`)
          }
          const client = readText('lib/client.js')
          if (!client.includes('window.__ModuleLoader__.load')) fail('lib/client.js has no ModuleLoader handoff')
          const patch = readText('cordis.patch.yml')
          if (!/^\s*-\s+id:\s*dsh-pause-session\s*$/m.test(patch)) fail('cordis.patch.yml has no dsh-pause-session row')
          if (!/^\s*name:\s*dsh-pause-session\s*$/m.test(patch)) fail('cordis.patch.yml has no dsh-pause-session name')

          const changelog = readText('CHANGELOG.md')
          if (!changelog.includes(`## [${tag}]`)) fail(`CHANGELOG.md has no ${tag} section`)
          console.log(`release check: ${pkg.name}@${pkg.version}`)
          NODE

      - name: Pack the package
        run: |
          mkdir -p "$RELEASE_DIR"
          pnpm pack --pack-destination "$RELEASE_DIR"

      - name: Verify tarball contents
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TGZ="$RELEASE_DIR/dsh-pause-session-$VERSION.tgz"
          test -f "$TGZ"
          for entry in package/lib/index.js package/lib/client.js package/cordis.patch.yml package/README.md package/README.zh.md package/DEVELOPMENT.md package/CHANGELOG.md package/LICENSE package/locale/en.json package/docs/images/pause-controls.webp; do
            tar -tzf "$TGZ" | grep -qx "$entry" || { echo "tarball is missing $entry"; exit 1; }
          done
          tar -xOf "$TGZ" package/package.json > "$RELEASE_DIR/packed-package.json"
          node - <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync(`${process.env.RELEASE_DIR}/packed-package.json`, 'utf8'))
          if (pkg.name !== 'dsh-pause-session') throw new Error(`packed name is ${pkg.name}`)
          if (pkg.version !== process.env.GITHUB_REF_NAME.replace(/^v/, '')) throw new Error('packed version differs from tag')
          if (pkg.repository?.url !== 'git+https://github.com/timho1047/dsh-pause-session.git') throw new Error('packed repository metadata is missing or wrong')
          if (JSON.stringify(pkg).includes('workspace:')) throw new Error('packed manifest still contains workspace:')
          NODE

      - name: Publish to npm when this version is new
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TGZ="$RELEASE_DIR/dsh-pause-session-$VERSION.tgz"
          if npm view "dsh-pause-session@$VERSION" version >/dev/null 2>&1; then
            echo "dsh-pause-session@$VERSION is already published; skipping npm publish."
          else
            npm publish "$TGZ" --access public --provenance
          fi

      - name: Extract release notes from the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { capture = 1; next }
            capture && substr($0, 1, 3) == "## " { exit }
            capture && (printed || length($0) > 0) { printed = 1; print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create or update the GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --notes-file release-notes.md --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" "$RELEASE_DIR/dsh-pause-session-"*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
